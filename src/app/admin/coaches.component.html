<div class="min-h-screen bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors">
  @if (checkingAuth()) {
  <div class="min-h-screen flex items-center justify-center bg-white dark:bg-slate-950">
    <div class="flex flex-col items-center gap-4">
      <div
        class="w-16 h-16 border-4 border-rose-200 border-t-rose-500 rounded-full animate-spin dark:border-rose-500/30 dark:border-t-rose-400">
      </div>
      <p class="text-slate-500 font-medium dark:text-slate-300">Verifying admin access...</p>
    </div>
  </div>
  } @else {
  <header
    class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200 dark:bg-slate-900/80 dark:border-white/5">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a routerLink="/admin"
            class="flex items-center justify-center w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all border border-slate-200 dark:bg-slate-800 dark:border-white/10 dark:hover:bg-slate-700">
            <svg class="w-5 h-5 text-slate-700 dark:text-slate-200" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
          </a>
          <div>
            <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight dark:text-white">Coaches</h1>
            <p class="text-slate-500 text-sm dark:text-slate-400">Launchpad coach system prompts</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button type="button" (click)="toggleDarkMode()" [attr.aria-pressed]="isDarkMode()"
            class="p-2.5 rounded-full border border-slate-200 text-slate-600 hover:bg-slate-100 transition-colors dark:border-white/20 dark:text-white dark:hover:bg-white/10"
            title="Toggle appearance">
            @if (isDarkMode()) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
            </svg>
            } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364 6.364l-1.414-1.414M7.05 7.05 5.636 5.636m12.728 0-1.414 1.414M7.05 16.95l-1.414 1.414M12 8a4 4 0 100 8 4 4 0 000-8z" />
            </svg>
            }
          </button>
          <app-avatar-dropdown />
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
    <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden dark:bg-slate-900/80 dark:border-white/10">
      <div class="px-6 py-5 border-b border-slate-200 dark:border-white/10">
        <p class="text-xs font-semibold uppercase tracking-[0.08em] text-slate-500 dark:text-slate-400">Coach Directory</p>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white">All Coaches ({{ coachPrompts.length }})</h2>
      </div>
      <div class="divide-y divide-slate-200 dark:divide-white/10">
        @for (coach of coachPrompts; track coach.id) {
        <article class="p-6 space-y-3">
          <div class="flex flex-wrap items-center gap-2">
            <span class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700 dark:bg-slate-800 dark:text-slate-200">
              {{ coach.appName }}
            </span>
            <h3 class="text-lg font-bold text-slate-900 dark:text-white">{{ coach.coachName }}</h3>
          </div>
          <div class="rounded-xl border border-slate-200 bg-slate-50 p-4 dark:border-white/10 dark:bg-slate-900">
            <p class="text-xs font-semibold uppercase tracking-[0.08em] text-slate-500 dark:text-slate-400 mb-2">System Prompt</p>
            <pre class="m-0 whitespace-pre-wrap break-words text-sm text-slate-700 dark:text-slate-200">{{ coach.systemPrompt }}</pre>
          </div>
        </article>
        }
      </div>
    </section>
  </main>
  }
</div>
