<div class="ai-premium-shell min-h-screen" [class.light-mode]="isLightMode()">
  <div class="ai-gradient-bg"></div>
  <div class="ai-grid-overlay"></div>

  <!-- Top bar -->
  <header class="ai-nav">
    <div class="nav-left">
      <a [routerLink]="authService.profile()?.userId ? '/goals' : '/'" class="logo-link">
        <img src="/assets/rocket-goals.png" alt="Rocket Goals" class="logo" />
        <div class="logo-text">
          <span>ROCKET</span><span class="accent">GOALS</span>
        </div>
      </a>
      <div class="badge">Premium AI</div>
    </div>
    <div class="nav-right">
      <button type="button" class="ghost-btn icon-btn" (click)="toggleTheme()" aria-label="Toggle theme">
        <svg *ngIf="isLightMode()" viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364 6.364l-1.414-1.414M7.05 7.05 5.636 5.636m12.728 0-1.414 1.414M7.05 16.95l-1.414 1.414M12 8a4 4 0 100 8 4 4 0 000-8z" />
        </svg>
        <svg *ngIf="!isLightMode()" viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
        </svg>
      </button>
      <a routerLink="/goals" class="ghost-btn">Mission Control</a>
      <a routerLink="/login" class="outline-btn" *ngIf="!authService.profile()">Log in</a>
      <a routerLink="/signup" class="solid-btn">Start Free</a>
    </div>
  </header>

<main class="chat-main">
  <section class="chat-card glass">
    <div class="chat-head">
      <div>
        <p class="eyebrow">RocketGoals AI</p>
        <h1 class="hero-title">Direct answers. No fluff.</h1>
        <p class="hero-subtitle">Ask anything about your mission and get focused guidance fast.</p>
      </div>
      <div class="status-pill">
        <span class="status-dot"></span>
        <div>
          <p class="status-label">Live</p>
          <p class="status-text">Gemini-powered</p>
        </div>
      </div>
    </div>

    <div class="ai-panel glass inner">
      <app-rocket-goals-ai [embedded]="true" />
    </div>
  </section>
</main>
</div>
